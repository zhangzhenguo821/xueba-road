<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学霸之路：四五六年级全科突破平台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --math:#6C5CE7;--math-light:#A29BFE;--math-bg:rgba(108,92,231,0.08);
  --chinese:#FF6B35;--chinese-light:#FDCB6E;--chinese-bg:rgba(255,107,53,0.08);
  --english:#00B894;--english-light:#55EFC4;--english-bg:rgba(0,184,148,0.08);
  --bg:#F5F6FA;--bg-card:#FFFFFF;--bg-dark:#1A1A2E;--bg-nav:#16213E;
  --text:#2D3436;--text-secondary:#636E72;--text-dim:#B2BEC3;
  --primary:#FF6B35;--accent:#FFE66D;--danger:#FF6B6B;--success:#00B894;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --shadow:0 4px 20px rgba(0,0,0,0.06);--shadow-lg:0 8px 30px rgba(0,0,0,0.10);
  --transition:all 0.25s cubic-bezier(0.4,0,0.2,1)
}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ====== Header ====== */
.app-header{background:var(--bg-dark);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
.app-logo{display:flex;align-items:center;gap:10px}
.app-logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--danger));display:flex;align-items:center;justify-content:center;font-size:18px}
.app-logo-text{font-size:16px;font-weight:700;color:white;letter-spacing:0.5px}
.app-logo-text span{color:var(--accent);font-weight:900}
.app-nav{display:flex;gap:8px;align-items:center}
.nav-pill{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:var(--transition);background:rgba(255,255,255,0.06);color:var(--text-dim)}
.nav-pill:hover{background:rgba(255,255,255,0.12);color:white}
.nav-pill.active{background:var(--primary);color:white}
.progress-bar-mini{display:flex;gap:2px;align-items:center;margin-left:8px}
.progress-pip{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.12);transition:var(--transition)}
.progress-pip.done{background:var(--success)}
.progress-pip.current{background:var(--accent);animation:pip 2s infinite}
@keyframes pip{0%,100%{opacity:1}50%{opacity:.4}}
.progress-count{font-size:11px;color:var(--text-dim);margin-left:6px;font-weight:600}

/* ====== Pages ====== */
.page{display:none;min-height:calc(100vh - 56px);padding:24px 32px}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ====== Page: Dashboard (思维导航) ====== */
.dash-hero{background:linear-gradient(135deg,#1A1A2E,#16213E);border-radius:var(--radius);padding:32px;margin-bottom:24px;color:white;position:relative;overflow:hidden}
.dash-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,107,53,0.2),transparent);border-radius:50%}
.dash-hero-title{font-size:28px;font-weight:900;margin-bottom:6px}
.dash-hero-sub{font-size:13px;color:var(--text-dim);margin-bottom:16px}
.dash-hero-sub b{color:var(--accent)}
.dash-search{display:flex;align-items:center;background:rgba(255,255,255,0.08);border-radius:var(--radius-xs);padding:10px 16px;max-width:480px;border:1.5px solid rgba(255,255,255,0.1)}
.dash-search input{width:100%;border:none;font-size:14px;color:white;outline:none;background:transparent}
.dash-search input::placeholder{color:rgba(255,255,255,0.35)}
.dash-search-icon{font-size:16px;margin-right:10px;opacity:0.6}

/* Thinking Tree */
.tree-container{max-width:900px;margin:0 auto}
.tree-grade{background:var(--bg-card);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:2px solid transparent;transition:var(--transition)}
.tree-grade:hover{border-color:rgba(0,0,0,0.04)}
.tree-grade.g4{border-left:4px solid #FF6B6B}
.tree-grade.g5{border-left:4px solid #4ECDC4}
.tree-grade.g6{border-left:4px solid #6C5CE7}
.tree-grade-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none;transition:var(--transition)}
.tree-grade-header:hover{background:rgba(0,0,0,0.01)}
.tree-grade-icon{font-size:20px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tree-grade.g4 .tree-grade-icon{background:rgba(255,107,107,0.12);color:#FF6B6B}
.tree-grade.g5 .tree-grade-icon{background:rgba(78,205,196,0.12);color:#4ECDC4}
.tree-grade.g6 .tree-grade-icon{background:rgba(108,92,231,0.12);color:#6C5CE7}
.tree-grade-title{font-size:18px;font-weight:700;flex:1}
.tree-grade-count{font-size:12px;color:var(--text-dim);background:rgba(0,0,0,0.04);padding:4px 12px;border-radius:20px;flex-shrink:0}
.tree-grade-arrow{font-size:14px;color:var(--text-dim);transition:transform 0.3s ease;flex-shrink:0}
.tree-grade.open .tree-grade-arrow{transform:rotate(90deg)}
.tree-grade-body{display:none;padding:0 20px 16px}
.tree-grade.open .tree-grade-body{display:block}

.tree-subject{margin-bottom:6px}
.tree-subject-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;border-radius:8px;transition:var(--transition)}
.tree-subject-header:hover{background:rgba(0,0,0,0.02)}
.tree-subject-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tree-subject-arrow{font-size:12px;transition:transform 0.3s ease}
.tree-subject.open .tree-subject-arrow{transform:rotate(90deg)}
.tree-chips{display:none;padding:4px 0 4px 22px}
.tree-subject.open .tree-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}

.tree-chip{padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;transition:var(--transition);background:rgba(0,0,0,0.02);color:var(--text-secondary);border:1.5px solid transparent;display:flex;align-items:center;gap:6px;line-height:1.4}
.tree-chip:hover{background:rgba(0,0,0,0.04);color:var(--text);border-color:rgba(0,0,0,0.06);transform:translateX(2px)}
.tree-chip-id{font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;flex-shrink:0}
.tree-chip.math .tree-chip-id{background:var(--math-bg);color:var(--math)}
.tree-chip.chinese .tree-chip-id{background:var(--chinese-bg);color:var(--chinese)}
.tree-chip.english .tree-chip-id{background:var(--english-bg);color:var(--english)}
.tree-chip-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ====== Page: 痛点路由器 ====== */
.home-hero{text-align:center;padding:32px 20px 20px}
.home-hero-title{font-size:32px;font-weight:900;margin-bottom:6px}
.home-hero-sub{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
.home-hero-sub b{color:var(--primary);font-weight:700}

.grade-selector{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.grade-btn{padding:12px 24px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:2px solid transparent;cursor:pointer;transition:var(--transition);background:var(--bg-card);color:var(--text-secondary);box-shadow:var(--shadow)}
.grade-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.grade-btn.g4{border-color:#FF6B6B;color:#FF6B6B;background:rgba(255,107,107,0.06)}
.grade-btn.g5{border-color:#4ECDC4;color:#4ECDC4;background:rgba(78,205,196,0.06)}
.grade-btn.g6{border-color:#6C5CE7;color:#6C5CE7;background:rgba(108,92,231,0.06)}

.search-box{max-width:480px;margin:0 auto 32px;display:flex;align-items:center;background:var(--bg-card);border-radius:var(--radius-sm);padding:12px 18px;box-shadow:var(--shadow);border:2px solid rgba(0,0,0,0.03)}
.search-box input{width:100%;border:none;font-size:14px;color:var(--text);outline:none;background:transparent}
.search-box input::placeholder{color:var(--text-dim)}
.search-icon{font-size:18px;color:var(--text-dim);margin-right:10px}

.pain-section{margin-bottom:28px}
.pain-section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-left:4px}
.pain-section-dot{width:10px;height:10px;border-radius:50%}
.pain-section-title{font-size:18px;font-weight:700}
.pain-section-count{font-size:11px;color:var(--text-dim);background:rgba(0,0,0,0.04);padding:3px 10px;border-radius:20px}

.pain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pain-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);border:2px solid transparent;position:relative;overflow:hidden}
.pain-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:rgba(0,0,0,0.06)}
.pain-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px}
.pain-card.math::before{background:var(--math)}
.pain-card.chinese::before{background:var(--chinese)}
.pain-card.english::before{background:var(--english)}
.pain-card-icon{font-size:24px;margin-bottom:8px}
.pain-card-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.pain-card-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.pain-card-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-top:8px}
.pain-card.math .pain-card-tag{background:var(--math-bg);color:var(--math)}
.pain-card.chinese .pain-card-tag{background:var(--chinese-bg);color:var(--chinese)}
.pain-card.english .pain-card-tag{background:var(--english-bg);color:var(--english)}

/* ====== Page: 思维模型舱 ====== */
.model-page{max-width:1060px;margin:0 auto}
.model-top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.model-back{padding:7px 14px;border-radius:8px;background:var(--bg-card);border:none;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:var(--transition);color:var(--text-secondary)}
.model-back:hover{background:var(--bg-dark);color:white}
.model-code{display:inline-flex;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.5px}
.model-title{font-size:28px;font-weight:900;margin-bottom:2px}
.model-subtitle{font-size:13px;color:var(--text-dim);margin-bottom:20px}

.model-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.model-panel{background:var(--bg-card);border-radius:var(--radius-sm);padding:24px;box-shadow:var(--shadow)}
.model-panel-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.model-panel-title .dot{width:7px;height:7px;border-radius:50%}

/* 视频区 */
.video-area{background:var(--bg-dark);border-radius:var(--radius-xs);padding:28px 18px;text-align:center;position:relative;min-height:160px}
.video-play-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;margin:0 auto 12px;transition:var(--transition);color:white}
.video-play-btn:hover{background:var(--primary);border-color:var(--primary)}
.video-title{font-size:15px;font-weight:600;color:white;margin-bottom:6px}
.video-duration{font-size:12px;color:var(--text-dim)}
.video-tags{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.video-tag{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(255,230,109,0.12);color:var(--accent)}

/* 学霸卡 */
.card-visual{border-radius:var(--radius-xs);padding:20px;min-height:180px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-visual.math-cv{background:var(--math-bg);border:2px solid rgba(108,92,231,0.12)}
.card-visual.chinese-cv{background:var(--chinese-bg);border:2px solid rgba(255,107,53,0.12)}
.card-visual.english-cv{background:var(--english-bg);border:2px solid rgba(0,184,148,0.12)}

/* 洋葱模型 */
.onion-model{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.onion-layer{padding:14px 20px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);width:100%;max-width:300px;text-align:center}
.onion-layer:hover{transform:scale(1.03);box-shadow:var(--shadow)}
.onion-outer{background:var(--chinese-light);color:var(--bg-dark);font-weight:700}
.onion-middle{background:var(--math-light);color:white}
.onion-inner{background:var(--primary);color:white;font-weight:700}
.onion-label{font-size:10px;margin-top:3px;font-weight:400;opacity:0.85}

/* 动词爆炸 */
.verb-burst-model{text-align:center;width:100%}
.verb-core-word{display:inline-flex;padding:10px 20px;border-radius:10px;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--danger));color:white;box-shadow:0 4px 12px rgba(255,107,53,0.35);margin-bottom:12px}
.verb-particles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.verb-particle{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);background:rgba(108,92,231,0.1);color:var(--math);border:1.5px solid rgba(108,92,231,0.15)}
.verb-particle:hover{transform:translateY(-2px);background:rgba(108,92,231,0.18);border-color:var(--math)}

/* 磁铁模型 */
.magnet-model{text-align:center}
.magnet-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.magnet-subject{padding:10px 16px;border-radius:10px;background:#FF6B6B;color:white;font-size:16px;font-weight:800;box-shadow:0 3px 10px rgba(255,107,107,0.35)}
.magnet-verb{padding:10px 16px;border-radius:10px;background:rgba(255,255,255,0.9);color:var(--text);font-size:16px;font-weight:600;border:2px dashed var(--text-dim)}
.magnet-suffix{padding:10px 8px;border-radius:10px;background:var(--english);color:white;font-size:16px;font-weight:800;animation:mPulse 1.5s infinite}
.magnet-arrow{font-size:20px;color:var(--english);animation:mPulse 1.5s infinite}
@keyframes mPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

/* 数轴模型 */
.axis-visual{padding:16px 0;text-align:center}
.axis-line{height:6px;background:linear-gradient(90deg,var(--danger),#888,var(--success));border-radius:3px;margin:14px auto;max-width:260px;position:relative}
.axis-gap{background:var(--danger);height:3px;border-radius:2px;margin:6px auto;max-width:180px;animation:gapPulse 2s infinite}
@keyframes gapPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* 双师讲解区 */
.canvas-area{background:var(--bg-card);border-radius:var(--radius-sm);padding:24px;box-shadow:var(--shadow);border:2px solid rgba(0,0,0,0.03);min-height:200px}
.canvas-area-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.canvas-area-title .dot{width:7px;height:7px;border-radius:50%}

/* Accordion 折叠组件 */
.accordion{border-radius:var(--radius-xs);overflow:hidden;margin-bottom:8px;border:1.5px solid rgba(0,0,0,0.04)}
.accordion-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--bg);transition:var(--transition);user-select:none;font-size:13px;font-weight:600}
.accordion-header:hover{background:rgba(0,0,0,0.02)}
.accordion-arrow{font-size:10px;transition:transform 0.3s ease;color:var(--text-dim)}
.accordion.open .accordion-arrow{transform:rotate(90deg)}
.accordion-body{display:none;padding:14px 18px;border-top:1px solid rgba(0,0,0,0.04);background:rgba(0,0,0,0.01);font-size:13px;color:var(--text-secondary);line-height:1.7}
.accordion.open .accordion-body{display:block}
.accordion.math{border-left:3px solid var(--math)}
.accordion.chinese{border-left:3px solid var(--chinese)}
.accordion.english{border-left:3px solid var(--english)}

/* 视频-认知闭环联动卡片 */
.cognition-loop{background:linear-gradient(135deg, rgba(255,107,53,0.04), rgba(108,92,231,0.04));border-radius:var(--radius-sm);padding:16px 20px;margin-top:14px;border:1.5px dashed rgba(255,107,53,0.15);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cognition-loop-icon{font-size:24px;flex-shrink:0}
.cognition-loop-text{flex:1;min-width:180px}
.cognition-loop-title{font-size:13px;font-weight:700;margin-bottom:3px}
.cognition-loop-desc{font-size:11px;color:var(--text-secondary);line-height:1.5}
.cognition-loop-btn{padding:8px 18px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:var(--transition);background:var(--primary);color:white;flex-shrink:0;white-space:nowrap}
.cognition-loop-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(255,107,53,0.25)}

/* 大白话脚本 */
.script-area{background:var(--bg-card);border-radius:var(--radius-sm);padding:24px;box-shadow:var(--shadow);margin-top:18px}
.script-label{display:inline-flex;padding:3px 12px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:12px;background:rgba(255,107,53,0.08);color:var(--primary)}
.script-text{font-size:14px;line-height:1.8;color:var(--text)}
.script-text em{color:var(--primary);font-weight:700;font-style:normal}

/* 真题区 */
.exams-area{background:var(--bg-card);border-radius:var(--radius-sm);padding:24px;box-shadow:var(--shadow);margin-top:18px}
.exams-label{display:inline-flex;padding:3px 12px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:12px;background:rgba(0,184,148,0.08);color:var(--english)}
.exam-list{display:flex;flex-direction:column;gap:8px}
.exam-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:8px 12px;background:rgba(0,0,0,0.02);border-radius:6px}
.exam-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* 通关按钮 */
.pass-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 32px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;border:none;cursor:pointer;transition:var(--transition);margin-top:20px}
.pass-btn.unlocked{background:linear-gradient(135deg,var(--primary),var(--danger));color:white;box-shadow:0 4px 16px rgba(255,107,53,0.35)}
.pass-btn.unlocked:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,53,0.45)}
.pass-btn.locked{background:var(--text-dim);color:white;cursor:not-allowed;opacity:0.4}

/* ====== Page: 闭环诊断区 ====== */
.diag-page{max-width:760px;margin:0 auto}
.diag-header{text-align:center;margin-bottom:28px}
.diag-header-title{font-size:26px;font-weight:900;margin-bottom:6px}
.diag-header-sub{font-size:13px;color:var(--text-secondary)}

.diag-question-box{background:var(--bg-card);border-radius:var(--radius-sm);padding:28px;box-shadow:var(--shadow);margin-bottom:20px;border:2px solid rgba(0,0,0,0.03)}
.diag-q-label{display:inline-flex;padding:3px 12px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:14px;background:rgba(108,92,231,0.08);color:var(--math)}
.diag-q-text{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:16px}
.diag-options{display:flex;flex-direction:column;gap:8px}
.diag-option{padding:12px 16px;border-radius:8px;border:2px solid rgba(0,0,0,0.05);background:var(--bg-card);cursor:pointer;transition:var(--transition);font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:10px}
.diag-option:hover{border-color:var(--primary);color:var(--text)}
.diag-option.selected{border-color:var(--primary);background:rgba(255,107,53,0.04);color:var(--text);font-weight:600}
.opt-letter{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.04);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.diag-option.selected .opt-letter{background:var(--primary);color:white}

.diag-ai-panel{background:var(--bg-dark);border-radius:var(--radius-sm);padding:24px;margin-bottom:20px;color:white}
.diag-ai-title{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--accent)}
.diag-ai-options{display:flex;flex-direction:column;gap:8px}
.diag-ai-opt{padding:12px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);cursor:pointer;transition:var(--transition);font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:10px}
.diag-ai-opt:hover{border-color:var(--primary);color:white}
.diag-ai-opt.selected{border-color:var(--primary);background:rgba(255,107,53,0.08);color:white;font-weight:600}
.ai-label{font-size:12px;font-weight:600;color:var(--accent);min-width:100px}

.diag-result{background:var(--bg-card);border-radius:var(--radius-sm);padding:28px;box-shadow:var(--shadow)}
.diag-result-icon{font-size:44px;margin-bottom:10px;text-align:center}
.diag-result-title{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}
.diag-result-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;text-align:center}

/* ====== Empty State ====== */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-title{font-size:22px;font-weight:700;margin-bottom:6px}
.empty-desc{font-size:14px;color:var(--text-secondary)}

/* ====== Responsive ====== */
@media(max-width:768px){
  .page{padding:16px}
  .pain-grid{grid-template-columns:1fr}
  .model-layout{grid-template-columns:1fr}
  .grade-selector{flex-wrap:wrap}
  .home-hero-title{font-size:24px}
  .model-title{font-size:22px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .roadmap{flex-direction:column}
  .roadmap-step:first-child{border-radius:var(--radius-xs) var(--radius-xs) 0 0}
  .roadmap-step:last-child{border-radius:0 0 var(--radius-xs) var(--radius-xs)}
}

/* ====== 认知模型详情页 ====== */
.model-detail{max-width:900px;margin:0 auto}
.model-detail-header{background:linear-gradient(135deg,#1A1A2E,#16213E);border-radius:var(--radius);padding:28px 32px;margin-bottom:20px;color:white;position:relative;overflow:hidden}
.model-detail-header::after{content:'';position:absolute;top:-30px;right:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,107,53,0.15),transparent);border-radius:50%}
.model-detail-icon{font-size:40px;margin-bottom:8px}
.model-detail-title{font-size:26px;font-weight:900;margin-bottom:4px}
.model-detail-sub{font-size:12px;color:var(--text-dim)}
.model-detail-sub b{color:var(--accent)}

.model-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid transparent}
.model-section.freq{border-left-color:#6C5CE7}
.model-section.mistake{border-left-color:#FF6B6B}
.model-section.insight{border-left-color:#FFE66D;background:linear-gradient(135deg,#FFFBEB,#FFF3CD)}
.model-section.solution{border-left-color:#00B894}
.model-section.variant{border-left-color:#0984E3}

.model-section-label{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.model-section-label .emoji{font-size:18px}

/* 高频考法 */
.freq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.freq-tag{background:rgba(108,92,231,0.08);border-radius:8px;padding:8px 12px;font-size:12px;color:#6C5CE7;font-weight:500}

/* 错因卡片 */
.mistake-cards{display:flex;flex-direction:column;gap:12px}
.mistake-card{background:rgba(255,107,107,0.04);border:1.5px solid rgba(255,107,107,0.15);border-radius:12px;padding:16px 20px}
.mistake-card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mistake-card-badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
.mistake-card-badge.high{background:#FF6B6B;color:white}
.mistake-card-badge.mid{background:#FDCB6E;color:#2D3436}
.mistake-card-type{font-size:15px;font-weight:700}
.mistake-card-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:10px}
.mistake-card-example{background:rgba(0,0,0,0.03);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text-dim);line-height:1.7}
.mistake-card-example b{color:var(--danger)}

/* 顿悟区 */
.insight-box{padding:8px 0}
.insight-oneliner{font-size:22px;font-weight:900;color:#E17055;line-height:1.5;margin-bottom:12px;position:relative;padding-left:28px}
.insight-oneliner::before{content:'💡';position:absolute;left:0;top:0}
.insight-explain{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:8px}
.insight-trigger{font-size:12px;color:var(--text-dim);font-style:italic}

/* 解法步骤 */
.solution-steps{display:flex;flex-direction:column;gap:10px}
.solution-step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:rgba(0,184,148,0.04);border-radius:10px;transition:var(--transition)}
.solution-step:hover{background:rgba(0,184,148,0.08)}
.solution-step-num{width:32px;height:32px;border-radius:50%;background:#00B894;color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.solution-step-body{flex:1}
.solution-step-title{font-size:14px;font-weight:700;margin-bottom:2px}
.solution-step-action{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:2px}
.solution-step-hint{font-size:11px;color:var(--accent);font-style:italic}
.solution-formula{background:rgba(0,184,148,0.1);border:1.5px dashed rgba(0,184,148,0.3);border-radius:10px;padding:12px 18px;text-align:center;font-size:16px;font-weight:700;color:#00B894;margin-top:4px}

/* 变式题列表 */
.variant-list{display:flex;flex-direction:column;gap:8px}
.variant-item{background:rgba(9,132,227,0.03);border:1.5px solid rgba(9,132,227,0.1);border-radius:10px;overflow:hidden;transition:var(--transition)}
.variant-item:hover{border-color:rgba(9,132,227,0.25)}
.variant-q{cursor:pointer;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;user-select:none}
.variant-q:hover{background:rgba(9,132,227,0.04)}
.variant-q-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.variant-diff{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;color:white;flex-shrink:0}
.variant-diff.d1{background:rgba(0,184,148,0.7)}
.variant-diff.d2{background:rgba(253,203,110,0.8);color:#2D3436}
.variant-diff.d3{background:rgba(255,107,107,0.8)}
.variant-q-text{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant-arrow{font-size:12px;color:var(--text-dim);transition:transform .2s}
.variant-item.open .variant-arrow{transform:rotate(180deg)}
.variant-a{display:none;padding:0 16px 14px}
.variant-item.open .variant-a{display:block}
.variant-a-answer{font-size:14px;font-weight:700;color:#0984E3;margin-bottom:8px}
.variant-a-solution{font-size:12px;color:var(--text-secondary);line-height:1.7;background:rgba(0,0,0,0.02);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.variant-a-verify{font-size:11px;color:#00B894;font-style:italic}

/* 思维路径图 SVG */
.mind-path-container{background:var(--bg-card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow);text-align:center}
.mind-path-container svg{max-width:100%;height:auto}
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-logo">
    <div class="app-logo-icon">🔥</div>
    <div class="app-logo-text">学霸之路 · <span>思维碎骨机</span></div>
  </div>
  <div class="app-nav">
    <button class="nav-pill active" data-page="dash" onclick="showPage('dash')">📊 作战大盘</button>
    <button class="nav-pill" data-page="home" onclick="showPage('home')">🏠 痛点直达</button>
    <button class="nav-pill" data-page="model" onclick="showPage('model')">🧠 模型舱</button>
    <button class="nav-pill" data-page="diag" onclick="showPage('diag')">🔍 诊断区</button>
    <div class="progress-bar-mini" id="progressMini"></div>
    <span class="progress-count" id="progressCount">0/161</span>
    <button class="nav-pill" onclick="_testAllClicks()" style="background:#333;color:#0f0;font-size:10px">🐛调试</button>
  </div>
</header>

<!-- Page: 思维导航 -->
<div class="page active" id="page-dash">
  <div class="dash-hero">
    <h1 class="dash-hero-title">🧭 思维导航 · 四五六年级全科考点树</h1>
    <p class="dash-hero-sub">点击年级→学科→考点，<b>3步直达实操</b> | 共 <b id="heroTotal">161</b> 个考点已入库</p>
    <div class="dash-search">
      <span class="dash-search-icon">🔍</span>
      <input type="text" placeholder="搜索考点…如：鸡兔同笼、过去时、写景作文" id="treeSearch" oninput="filterTree()">
    </div>
  </div>
  <div class="tree-container" id="treeContainer"></div>
</div>

<!-- Page: 痛点路由器 -->
<div class="page" id="page-home">
  <div class="home-hero">
    <h1 class="home-hero-title">3步之内开始实操</h1>
    <p class="home-hero-sub">不要章节目录，直接<b>阻击你的考场痛点</b></p>
  </div>
  <div class="grade-selector" id="gradeSelector">
    <button class="grade-btn g4" data-grade="4" onclick="selectGrade(4)">🔴 四年级</button>
    <button class="grade-btn" data-grade="5" onclick="selectGrade(5)">🟢 五年级</button>
    <button class="grade-btn" data-grade="6" onclick="selectGrade(6)">🔵 六年级</button>
  </div>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="输入你考试时的痛苦，如：写流水账、阴影不会算…" id="searchInput" oninput="filterPains()">
  </div>
  <div id="painWall"></div>
</div>

<!-- Page: 思维模型舱 -->
<div class="page" id="page-model">
  <div class="model-page" id="modelContent">
    <div class="empty-state">
      <div class="empty-icon">👆</div>
      <div class="empty-title">先选一个痛点</div>
      <div class="empty-desc">回到首页，点击你的考场痛点，3步直达实操</div>
    </div>
  </div>
</div>

<!-- Page: 闭环诊断区 -->
<div class="page" id="page-diag">
  <div class="diag-page" id="diagContent">
    <div class="empty-state">
      <div class="empty-icon">🧠</div>
      <div class="empty-title">先观看讲解视频</div>
      <div class="empty-desc">在模型舱里观看完两位老师的讲解后，再来这里通关验证</div>
    </div>
  </div>
</div>

<!-- DEBUG PANEL -->
<div id="debugPanel" style="position:fixed;bottom:0;left:0;right:0;max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:11px;padding:8px 12px;z-index:9999;display:block;border-top:2px solid #0f0"></div>
<style>.debug-line{padding:2px 0;border-bottom:1px solid rgba(0,255,0,0.1)}</style>

<script src="data.js?v=202606121200"></script>
<script>
// ====== 全局错误捕获 ======
window.onerror = function(msg, url, line, col, error) {
  _debugError('全局JS错误: ' + msg + ' (line ' + line + ')');
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  _debugError('未处理的Promise拒绝: ' + (e.reason && e.reason.message || e.reason));
});

// ====== State ======
let currentGrade = 4;
let currentChip = null;
let completedChips = new Set();

// ====== Navigation ======
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-pill').forEach(n => {
    n.classList.toggle('active', n.dataset.page === name);
  });
  window.scrollTo(0, 0);
}

// ====== Grade Selection ======
function selectGrade(g) {
  currentGrade = g;
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.className = 'grade-btn';
    if (parseInt(b.dataset.grade) === g) {
      b.classList.add('g' + g);
    }
  });
  renderPainWall();
}

// ====== Pain Wall ======
function renderPainWall(filterText) {
  const wall = document.getElementById('painWall');
  wall.innerHTML = '';
  const buttons = PAIN_BUTTONS[currentGrade];
  const subjects = ['数学','语文','英语'];

  subjects.forEach(subj => {
    if (!buttons[subj]) return;
    const items = buttons[subj].filter(b =>
      !filterText || b.label.includes(filterText)
    );
    if (!items.length) return;

    const meta = SUBJECT_MAP[subj];
    const cssClass = subj === '数学' ? 'math' : subj === '语文' ? 'chinese' : 'english';
    const section = document.createElement('div');
    section.className = 'pain-section';

    section.innerHTML = `
      <div class="pain-section-header">
        <div class="pain-section-dot" style="background:${meta.color}"></div>
        <div class="pain-section-title" style="color:${meta.color}">${meta.icon} ${subj}</div>
        <div class="pain-section-count">${items.length}个痛点</div>
      </div>
      <div class="pain-grid">
        ${items.map(item => `
          <div class="pain-card ${cssClass}" data-chip-id="${item.chipId}">
            <div class="pain-card-icon">${meta.icon}</div>
            <div class="pain-card-title">${item.label}</div>
            <div class="pain-card-desc">点击进入 → 3步开始实操</div>
            <div class="pain-card-tag">🏷️ ${item.chipId}</div>
          </div>
        `).join('')}
      </div>
    `;
    wall.appendChild(section);
  });

  // 使用事件委托 + addEventListener 绑定点击（替代 inline onclick）
  var boundCount = 0;
  wall.querySelectorAll('.pain-card').forEach(function(card) {
    var chipId = card.getAttribute('data-chip-id');
    if (chipId) {
      card.addEventListener('click', function(e) {
        e.stopPropagation();
        openChip(chipId);
      });
      boundCount++;
    }
  });
  _debugLog('  painCards 绑定了 ' + boundCount + ' 个事件监听器');
}

function filterPains() {
  renderPainWall(document.getElementById('searchInput').value.trim());
}

// ====== 模型ID映射表（chipId → 模型JSON文件名） ======
var MODEL_MAP = {
  'MATH-04-001': 'math-g4-diff-model'
};

// ====== Open Chip ======
function openChip(chipId) {
  try {
    _debugLog('openChip 被调用: ' + chipId);
    var chip = CHIPS.find(function(c) { return c.id === chipId; });
    if (!chip) {
      _debugError('CHIPS 中未找到 chipId=' + chipId);
      return;
    }
    _debugLog('  找到芯片: ' + chip.title.substring(0, 30) + '...');
    currentChip = chip;
    
    var modelId = MODEL_MAP[chipId];
    _debugLog('  MODEL_MAP[' + chipId + '] = ' + (modelId || 'undefined'));
    if (modelId) {
      renderModelDetail(chip, modelId);
    } else {
      renderModelPage(chip);
    }
    _debugLog('  切换到 model 页');
    showPage('model');
  } catch(e) {
    _debugError('openChip 异常: ' + e.message);
    console.error(e);
  }
}

// 调试面板
var _debugLines = [];
function _debugLog(msg) {
  _debugLines.push(msg);
  console.log('[DEBUG]', msg);
  _updateDebugPanel();
}
function _debugError(msg) {
  _debugLines.push('❌ ' + msg);
  console.error('[DEBUG]', msg);
  _updateDebugPanel();
}
function _updateDebugPanel() {
  var panel = document.getElementById('debugPanel');
  if (panel) {
    panel.innerHTML = _debugLines.slice(-20).map(function(l) { return '<div class="debug-line">' + l + '</div>'; }).join('');
  }
}

// ====== Render Model Page ======
function renderModelPage(chip) {
  const container = document.getElementById('modelContent');
  const meta = SUBJECT_MAP[chip.subject];
  const gradeMeta = GRADE_MAP[chip.grade];
  const cssClass = chip.subject === '数学' ? 'math' : chip.subject === '语文' ? 'chinese' : 'english';

  // 认知模型拆解 Accordion
  let modelHTML = buildAccordionVisual(chip, cssClass, meta);

  container.innerHTML =
    '<div class="model-top">' +
      '<button class="model-back" onclick="showPage(\'home\')">← 回首页</button>' +
      '<div class="model-code" style="background:' + meta.bg + ';color:' + meta.color + '">🏷️ ' + chip.id + '</div>' +
      '<div class="model-code" style="background:rgba(0,0,0,0.04);color:var(--text-dim)">' + (chip.examCodes && chip.examCodes.length > 0 ? chip.examCodes[0] : chip.id) + '</div>' +
    '</div>' +
    '<div>' +
      '<h2 class="model-title" style="color:' + meta.color + '">' + chip.icon + ' ' + chip.title + '</h2>' +
      '<div class="model-subtitle">' + gradeMeta.label + ' · ' + chip.subject + ' · ' + chip.category + '</div>' +
    '</div>' +

    '<div class="model-layout">' +
      '<div class="model-panel">' +
        '<div class="model-panel-title"><div class="dot" style="background:' + meta.color + '"></div>抖音级短视频舱</div>' +
        '<div class="video-area" id="videoArea_' + chip.id + '">' +
          '<div class="video-play-btn" onclick="playVideo(\'' + chip.id + '\')">▶</div>' +
          '<div class="video-title" id="videoTitle_' + chip.id + '">' + (chip.video && chip.video.title ? chip.video.title : '3分钟大白话切片：' + chip.title) + '</div>' +
          '<div class="video-duration" id="videoDur_' + chip.id + '">⏱ ' + (chip.video && chip.video.duration ? chip.video.duration : '约3分钟') + ' · 建议1.25x倍速</div>' +
          '<div class="video-tags">' +
            chip.keywords.map(function(k) { return '<div class="video-tag">' + k + '</div>'; }).join('') +
          '</div>' +
        '</div>' +
        '<!-- 视频-认知闭环联动 -->' +
        '<div class="cognition-loop">' +
          '<div class="cognition-loop-icon">🧠</div>' +
          '<div class="cognition-loop-text">' +
            '<div class="cognition-loop-title">认知模型：' + (chip.chip.modelType || '通用') + '</div>' +
            '<div class="cognition-loop-desc">' + (chip.chip.modelDesc ? chip.chip.modelDesc.substring(0, 60) + '…' : '看完视频后，用下方认知模型拆解检验你懂没懂') + '</div>' +
          '</div>' +
          '<button class="cognition-loop-btn" onclick="goToDiag(\'' + chip.id + '\')">去通关验证 →</button>' +
        '</div>' +
      '</div>' +
      '<div class="model-panel">' +
        '<div class="model-panel-title"><div class="dot" style="background:' + meta.color + '"></div>认知模型拆解 · 点开看一看</div>' +
        modelHTML +
      '</div>' +
    '</div>' +

    '<div class="canvas-area">' +
      '<div class="canvas-area-title"><div class="dot" style="background:' + meta.color + '"></div>双师讲解 · 换个老师再讲一遍</div>' +
      '<div id="videoArea2_' + chip.id + '" style="margin-top:8px">' +
        (chip.video2 && chip.video2.bvid ?
        '<div class="video-area" id="video2Play_' + chip.id + '" style="margin:0">' +
          '<div class="video-play-btn" onclick="playVideo2(\'' + chip.id + '\')">▶</div>' +
          '<div class="video-title" id="videoTitle2_' + chip.id + '">' + (chip.video2.title || '第二位老师讲解：' + chip.title) + '</div>' +
          '<div class="video-duration" id="videoDur2_' + chip.id + '">⏱ ' + (chip.video2.duration || '约3分钟') + ' · 换个角度也许就通了</div>' +
          '<div class="video-tags">' +
            '<div class="video-tag">👨‍🏫 第二位老师</div>' +
            '<div class="video-tag">🔄 不同讲法</div>' +
          '</div>' +
        '</div>'
        :
        '<div style="background:rgba(0,0,0,0.02);border-radius:12px;padding:24px;text-align:center;border:1.5px dashed rgba(0,0,0,0.08)">' +
          '<div style="font-size:28px;margin-bottom:8px">👨‍🏫</div>' +
          '<div style="font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">第二位老师视频待添加</div>' +
          '<div style="font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:12px">去B站搜索同一个考点<br>找不同老师/不同讲法的视频<br>填入 BV 号即可上线</div>' +
          '<button onclick="window.open(\'https://search.bilibili.com/all?keyword=' + encodeURIComponent(chip.title) + '\',\'_blank\')" class="pass-btn unlocked" style="font-size:12px">🔍 去B站搜「' + chip.title + '」</button>' +
        '</div>') +
      '</div>' +
    '</div>' +

    '<div style="text-align:center;margin-top:12px">' +
      '<button onclick="goToDiag(\'' + chip.id + '\')" class="pass-btn unlocked" style="font-size:13px;padding:10px 28px">🔍 进入通关诊断 →</button>' +
    '</div>' +

    '<div class="script-area">' +

function buildMindPathSVG(model, color) {
  var nodes = model.interaction.nodes;
  var edges = model.interaction.edges;
  var dangers = model.interaction.dangerLabels || {};
  
  var svgW = 680, svgH = 640;
  var startX = 340, startY = 50, stepY = 100;
  
  var nodeSVG = '';
  nodes.forEach(function(n, i) {
    var y = startY + i * stepY;
    var isDanger = dangers[n.id];
    var fill = isDanger ? '#FFEAA7' : '#FFFFFF';
    var stroke = isDanger ? '#FF6B6B' : color;
    
    nodeSVG += '<rect x="' + (startX - 130) + '" y="' + y + '" width="260" height="56" rx="12" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
    nodeSVG += '<text x="' + startX + '" y="' + (y + 22) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#2D3436">' + n.label + '</text>';
    nodeSVG += '<text x="' + startX + '" y="' + (y + 42) + '" text-anchor="middle" font-size="11" fill="#636E72">' + n.summary + '</text>';
    
    if (isDanger) {
      nodeSVG += '<text x="' + (startX - 120) + '" y="' + (y - 6) + '" font-size="12" fill="#FF6B6B">⚠️</text>';
    }
  });
  
  var edgeSVG = '';
  edges.forEach(function(e) {
    var fromIdx = nodes.findIndex(function(n) { return n.id === e.from; });
    var toIdx = nodes.findIndex(function(n) { return n.id === e.to; });
    if (fromIdx < 0 || toIdx < 0) return;
    
    var fromY = startY + fromIdx * stepY + 56;
    var toY = startY + toIdx * stepY;
    
    edgeSVG += '<line x1="' + startX + '" y1="' + fromY + '" x2="' + startX + '" y2="' + toY + '" stroke="' + color + '" stroke-width="1.5" stroke-dasharray="6,3"/>';
    edgeSVG += '<polygon points="' + startX + ',' + (toY - 6) + ' ' + (startX - 5) + ',' + toY + ' ' + (startX + 5) + ',' + toY + '" fill="' + color + '"/>';
    
    if (e.label) {
      edgeSVG += '<text x="' + (startX + 140) + '" y="' + ((fromY + toY) / 2 + 4) + '" font-size="10" fill="' + color + '">' + e.label + '</text>';
    }
  });
  
  var hintSVG = '';
  Object.keys(dangers).forEach(function(nid) {
    var idx = nodes.findIndex(function(n) { return n.id === nid; });
    if (idx < 0) return;
    var y = startY + idx * stepY + 72;
    hintSVG += '<text x="' + startX + '" y="' + y + '" text-anchor="middle" font-size="11" fill="#FF6B6B" font-weight="600">' + dangers[nid] + '</text>';
  });
  
  return '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="' + svgW + '" height="' + svgH + '" fill="#FAFBFC" rx="12"/>' +
    edgeSVG + nodeSVG + hintSVG +
    '<text x="' + startX + '" y="' + (svgH - 10) + '" text-anchor="middle" font-size="10" fill="#B2BEC3">差量模型 · 解题思维路径 · v1.0</text>' +
    '</svg>';
}

        <div class="diag-ai-opt" onclick="selectAiOption(this)">
          <div class="ai-label">B · 模型迁移卡点</div>
          我知道公式，但不知道这道题里的变量和模型有什么关系
        </div>
        <div class="diag-ai-opt" onclick="selectAiOption(this)">
          <div class="ai-label">C · 计算粗心卡点</div>
          我模型懂了，就是最后一步算错了
        </div>
      </div>
      <div id="diagAiResult" style="margin-top:14px;font-size:13px;color:var(--text-dim)"></div>
    </div>

    <div id="diagResultPanel" style="display:none">
      <div class="diag-result">
        <div class="diag-result-icon">🎉</div>
        <div class="diag-result-title" style="color:var(--success)">认知节点通关成功！</div>
        <div class="diag-result-desc">你已完成认知动作 + 通关验证<br>这个知识点在后台树状图上已标记为 <b style="color:var(--success)">[已通关]</b></div>
      </div>
      <div style="text-align:center;margin-top:18px">
        <button onclick="showPage('home')" class="pass-btn unlocked" style="background:linear-gradient(135deg,var(--success),var(--english-light))">🏠 回首页继续攻克下一个痛点</button>
      </div>
    </div>
  `;
}

function selectDiagOption(el, letter) {
  document.querySelectorAll('.diag-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  if (letter === 'A') {
    document.getElementById('diagResultPanel').style.display = 'block';
    document.getElementById('diagAiPanel').style.display = 'none';
  } else {
    document.getElementById('diagAiPanel').style.display = 'block';
    document.getElementById('diagResultPanel').style.display = 'none';
  }
}

function selectAiOption(el) {
  document.querySelectorAll('.diag-ai-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const resultDiv = document.getElementById('diagAiResult');
  const label = el.querySelector('.ai-label').textContent;
  const backBtn = `<button onclick="showPage('model')" style="padding:6px 14px;border-radius:6px;background:var(--primary);color:white;border:none;cursor:pointer;font-size:12px;margin-top:8px">回到模型舱 →</button>`;
  if (label.includes('信息提取')) {
    resultDiv.innerHTML = `<div style="background:rgba(78,205,196,0.08);padding:10px;border-radius:6px;margin-top:6px">✅ 系统已启动缩句游戏，高亮题干关键信息，帮你从长题干中精准提取。${backBtn}</div>`;
  } else if (label.includes('模型迁移')) {
    resultDiv.innerHTML = `<div style="background:rgba(108,92,231,0.08);padding:10px;border-radius:6px;margin-top:6px">✅ 系统已启动动画，把新题壳里的变量代换成你熟悉的模型元素。${backBtn}</div>`;
  } else {
    resultDiv.innerHTML = `<div style="background:rgba(255,230,109,0.08);padding:10px;border-radius:6px;margin-top:6px">✅ 系统已弹出草稿纸，展示计算错因和学霸检查法。${backBtn}</div>`;
  }
}

// ====== Progress ======
function updateProgress() {
  const mini = document.getElementById('progressMini');
  const count = document.getElementById('progressCount');
  const total = CHIPS.length;
  const done = completedChips.size;
  // 显示最多20个小点
  const maxDots = Math.min(total, 20);
  let html = '';
  for (let i = 0; i < maxDots; i++) {
    const isDone = completedChips.has(CHIPS[i].id);
    html += '<div class="progress-pip ' + (isDone ? 'done' : '') + '"></div>';
  }
  mini.innerHTML = html;
  count.textContent = done + '/' + total;
}

// ====== Thinking Tree ======
function renderTree(filterText) {
  const container = document.getElementById('treeContainer');
  const grades = [
    { id: 4, label: '四年级', cls: 'g4', icon: '🔴', color: '#FF6B6B' },
    { id: 5, label: '五年级', cls: 'g5', icon: '🟢', color: '#4ECDC4' },
    { id: 6, label: '六年级', cls: 'g6', icon: '🔵', color: '#6C5CE7' }
  ];
  const subjects = ['数学', '语文', '英语'];
  const subjMeta = {
    '数学': { icon: '📐', color: '#6C5CE7', cls: 'math' },
    '语文': { icon: '✏️', color: '#FF6B35', cls: 'chinese' },
    '英语': { icon: '🇬🇧', color: '#00B894', cls: 'english' }
  };

  container.innerHTML = '';

  grades.forEach(function(g) {
    const gradeChips = CHIPS.filter(function(c) { return c.grade === g.id; });
    if (!gradeChips.length) return;

    // 对每个学科建立芯片列表
    const subjChips = {};
    subjects.forEach(function(s) {
      const chips = gradeChips.filter(function(c) { return c.subject === s; });
      if (filterText) {
        subjChips[s] = chips.filter(function(c) {
          return c.title.includes(filterText) || c.id.includes(filterText) || c.painPoint.includes(filterText);
        });
      } else {
        subjChips[s] = chips;
      }
    });

    // 计算年级总数
    let gradeTotal = 0;
    subjects.forEach(function(s) { gradeTotal += subjChips[s].length; });
    if (!gradeTotal && filterText) return;

    const gradeDiv = document.createElement('div');
    gradeDiv.className = 'tree-grade ' + g.cls;

    gradeDiv.innerHTML =
      '<div class="tree-grade-header" onclick="toggleTreeGrade(this.parentElement)">' +
        '<div class="tree-grade-icon">' + g.icon + '</div>' +
        '<div class="tree-grade-title">' + g.label + '</div>' +
        '<div class="tree-grade-count">' + gradeTotal + '个考点</div>' +
        '<div class="tree-grade-arrow">►</div>' +
      '</div>' +
      '<div class="tree-grade-body" id="treeBody_' + g.id + '"></div>';

    container.appendChild(gradeDiv);

    // 填充学科
    var body = document.getElementById('treeBody_' + g.id);
    subjects.forEach(function(s) {
      if (!subjChips[s].length) return;
      var meta = subjMeta[s];
      var subjDiv = document.createElement('div');
      subjDiv.className = 'tree-subject';
      subjDiv.innerHTML =
        '<div class="tree-subject-header" onclick="toggleTreeSubject(this.parentElement)">' +
          '<div class="tree-subject-dot" style="background:' + meta.color + '"></div>' +
          '<span>' + meta.icon + ' ' + s + '</span>' +
          '<span style="font-size:11px;color:var(--text-dim);margin-left:4px">(' + subjChips[s].length + ')</span>' +
          '<div class="tree-subject-arrow">►</div>' +
        '</div>' +
        '<div class="tree-chips"></div>';

      var chipsDiv = subjDiv.querySelector('.tree-chips');
      subjChips[s].forEach(function(chip) {
        var chipEl = document.createElement('div');
        chipEl.className = 'tree-chip ' + meta.cls;
        chipEl.setAttribute('data-chip-id', chip.id);
        chipEl.innerHTML = '<span class="tree-chip-id">' + chip.id + '</span>' +
          '<span class="tree-chip-text" title="' + chip.title.replace(/"/g, '&quot;') + '">' + chip.title + '</span>';
        chipEl.addEventListener('click', function(e) {
          e.stopPropagation();
          openChip(chip.id);
        });
        chipsDiv.appendChild(chipEl);
      });

      body.appendChild(subjDiv);
    });
  });
}

function toggleTreeGrade(el) {
  el.classList.toggle('open');
}

function toggleTreeSubject(el) {
  el.classList.toggle('open');
}

function filterTree() {
  renderTree(document.getElementById('treeSearch').value.trim());
}

// ====== 加载视频仓库（解耦数据源）======
function loadVideoWarehouse() {
  fetch('video-warehouse.json?v=202606121200')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(warehouse) {
      if (!warehouse || !warehouse.videos) return;
      warehouse.videos.forEach(function(v) {
        const chip = CHIPS.find(function(c) { return c.id === v.chipId; });
        if (chip && chip.video) {
          if (v.bvid) chip.video.bvid = v.bvid;
          if (v.title) chip.video.title = v.title;
          if (v.duration) chip.video.duration = v.duration;
          if (v.status) chip.video.status = v.status;
        }
        if (chip && !chip.video2) chip.video2 = {};
        if (chip && chip.video2) {
          if (v.bvid2) chip.video2.bvid = v.bvid2;
          if (v.title2) chip.video2.title = v.title2;
          if (v.duration2) chip.video2.duration = v.duration2;
          if (v.status2) chip.video2.status = v.status2;
        }
      });
    });
}

// ====== Init ======
function init() {
  _debugLog('🚀 init() 开始');
  _debugLog('  CHIPS 长度: ' + (typeof CHIPS !== 'undefined' ? CHIPS.length : 'UNDEFINED!'));
  _debugLog('  PAIN_BUTTONS: ' + (typeof PAIN_BUTTONS !== 'undefined' ? 'defined' : 'UNDEFINED!'));
  renderTree();
  selectGrade(4);
  updateProgress();
  loadVideoWarehouse();
  _debugLog('✅ init() 完成');
}

// 调试：测试所有痛点的点击
function _testAllClicks() {
  _debugLines = [];
  _debugLog('=== 🐛 开始全量点击测试 ===');
  var buttons = PAIN_BUTTONS[currentGrade];
  if (!buttons) { _debugError('PAIN_BUTTONS[' + currentGrade + '] 不存在'); return; }
  var total = 0, pass = 0, fail = 0;
  var failList = [];
  ['数学','语文','英语'].forEach(function(subj) {
    if (!buttons[subj]) return;
    buttons[subj].forEach(function(item, idx) {
      total++;
      var chip = CHIPS.find(function(c) { return c.id === item.chipId; });
      if (!chip) {
        fail++;
        failList.push(subj + '[' + idx + '] ' + item.chipId + ' - CHIPS未找到');
      } else {
        pass++;
      }
    });
  });
  _debugLog('总测试: ' + total + ' | ✅通过: ' + pass + ' | ❌失败: ' + fail);
  if (failList.length > 0) {
    failList.slice(0, 30).forEach(function(f) { _debugError(f); });
  }
  _debugLog('=== 🐛 测试完成 ===');
}

init();
