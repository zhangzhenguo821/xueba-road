<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识宝库 - 学霸之路</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0a0a1a; color: #e0e0ff; min-height: 100vh; }
header { background: linear-gradient(135deg, #0a0a2a, #1a1a3a); padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.back-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #a0a0cc; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; text-decoration: none; }
.back-btn:hover { background: rgba(255,255,255,0.15); color: white; }

.page { max-width: 1100px; margin: 0 auto; padding: 20px; }
.page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.page-desc { font-size: 13px; color: #8888aa; margin-bottom: 18px; }

/* Tabs */
.kb-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.kb-tab { padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.06); color: #8888cc; border: 1px solid transparent; transition: all .2s; }
.kb-tab:hover { background: rgba(255,255,255,0.1); color: #c0c0ff; }
.kb-tab.active { background: rgba(0,212,255,0.15); color: #00d4ff; border-color: rgba(0,212,255,0.3); }

/* Toolbar */
.kb-toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.kb-search { flex: 1; min-width: 180px; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 13px; }
.kb-search::placeholder { color: #555577; }
.kb-grade-filter { padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #a0a0cc; font-size: 13px; }
.kb-count { font-size: 12px; color: #6666aa; margin-left: auto; }

/* Grid */
.kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.kb-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; cursor: pointer; transition: all .2s; }
.kb-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(0,212,255,0.25); transform: translateY(-2px); }
.kb-card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.kb-card-meta { font-size: 12px; color: #8888aa; }
.kb-card-snippet { font-size: 13px; color: #aaaaaa; margin-top: 8px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Poem detail modal */
.poem-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
.poem-modal.active { display: flex; }
.poem-modal-inner { background: #12122a; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; max-width: 520px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 28px; position: relative; }
.poem-modal-close { position: absolute; top: 12px; right: 16px; font-size: 22px; cursor: pointer; color: #8888aa; background: none; border: none; }
.poem-title { font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 4px; }
.poem-author { text-align: center; font-size: 14px; color: #8888aa; margin-bottom: 18px; }
.poem-lines { font-size: 17px; line-height: 2; text-align: center; margin-bottom: 18px; }
.poem-type { text-align: center; font-size: 12px; color: #6666aa; margin-bottom: 12px; }
.poem-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; background: rgba(0,212,255,0.15); color: #00d4ff; }
.poem-actions { display: flex; gap: 8px; margin-top: 16px; }
.poem-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #c0c0ff; cursor: pointer; font-size: 13px; text-align: center; text-decoration: none; }
.poem-btn:hover { background: rgba(255,255,255,0.1); }

/* Idiom card */
.idiom-meaning { font-size: 13px; color: #bbbbdd; margin-top: 6px; line-height: 1.5; }
.idiom-pinyin { font-size: 12px; color: #00d4ff; }
.idiom-example { font-size: 12px; color: #8888aa; margin-top: 6px; font-style: italics; }

/* Xiehouyu */
.xhy-riddle { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.xhy-answer { font-size: 14px; color: #00d4ff; }

/* Print */
@media print {
  header, .kb-tabs, .kb-toolbar, .poem-actions { display: none !important; }
  body { background: white; color: #111; }
  .poem-modal { display: block !important; position: static; background: none; }
  .poem-modal-inner { border: none; max-height: none; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← 返回首页</a>
  <div class="logo">📚 知识宝库</div>
</header>

<div class="page">
  <div class="page-title">知识宝库</div>
  <div class="page-desc">来自 GitHub 开源项目的精选内容 —— 古诗词 · 成语 · 歇后语</div>

  <div class="kb-tabs">
    <div class="kb-tab active" onclick="kbSwitchTab('poetry')">📝 古诗词</div>
    <div class="kb-tab" onclick="kbSwitchTab('idiom')">📚 成语词典</div>
    <div class="kb-tab" onclick="kbSwitchTab('xiehouyu')">🎭 歇后语</div>
  </div>

  <div class="kb-toolbar">
    <input class="kb-search" id="kbSearch" placeholder="搜索..." oninput="kbRender()">
    <select class="kb-grade-filter" id="kbGradeFilter" onchange="kbRender()">
      <option value="0">全部年级</option>
      <option value="1">一年级</option>
      <option value="2">二年级</option>
      <option value="3">三年级</option>
      <option value="4">四年级</option>
      <option value="5">五年级</option>
      <option value="6">六年级</option>
    </select>
    <div class="kb-count" id="kbCount"></div>
  </div>

  <div class="kb-grid" id="kbGrid"></div>
</div>

<!-- Poem Detail Modal -->
<div class="poem-modal" id="poemModal">
  <div class="poem-modal-inner">
    <button class="poem-modal-close" onclick="kbClosePoem()">&times;</button>
    <div class="poem-title" id="poemTitle"></div>
    <div class="poem-author" id="poemAuthor"></div>
    <div class="poem-type" id="poemType"></div>
    <div class="poem-lines" id="poemLines"></div>
    <div class="poem-actions">
      <button class="poem-btn" onclick="window.print()">🖨️ 打印</button>
      <button class="poem-btn" id="poemCopyBtn" onclick="kbCopyPoem()">📋 复制</button>
    </div>
  </div>
</div>

<script src="data/knowledge/poetry.js"></script>
<script src="data/knowledge/idioms.js"></script>
<script src="data/knowledge/xiehouyu.js"></script>
<script>
var kbCurrentTab = 'poetry';

function kbSwitchTab(tab) {
  kbCurrentTab = tab;
  document.querySelectorAll('.kb-tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  kbRender();
}

function kbRender() {
  var search = (document.getElementById('kbSearch').value || '').trim().toLowerCase();
  var grade = parseInt(document.getElementById('kbGradeFilter').value) || 0;

  if (kbCurrentTab === 'poetry') kbRenderPoetry(search, grade);
  else if (kbCurrentTab === 'idiom') kbRenderIdiom(search);
  else if (kbCurrentTab === 'xiehouyu') kbRenderXiehouyu(search);
}

function kbRenderPoetry(search, grade) {
  var data = (_POETRY_DATA || []).filter(function(p) {
    if (search) {
      var hay = (p.title + p.author + p.paragraphs.join('')).toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    if (grade > 0 && p.grades && p.grades.indexOf(grade) === -1) return false;
    return true;
  });
  document.getElementById('kbCount').textContent = '共 ' + data.length + ' 首';
  var grid = document.getElementById('kbGrid');
  grid.innerHTML = data.map(function(p, i) {
    var snippet = p.paragraphs.slice(0, 2).join('，');
    return '<div class="kb-card" onclick="kbShowPoem(' + i + ')">' +
      '<div class="kb-card-title">' + esc(p.title) + (p.required ? ' ⭐' : '') + '</div>' +
      '<div class="kb-card-meta">' + esc(p.author) + ' · ' + esc(p.type) + '</div>' +
      '<div class="kb-card-snippet">' + esc(snippet) + '</div>' +
      '</div>';
  }).join('');
}

function kbRenderIdiom(search) {
  var data = (_IDIOM_DATA || []).filter(function(d) {
    if (!search) return true;
    var hay = (d.word + d.explanation + (d.example||'')).toLowerCase();
    return hay.indexOf(search) !== -1;
  });
  document.getElementById('kbCount').textContent = '共 ' + data.length + ' 条';
  var grid = document.getElementById('kbGrid');
  grid.innerHTML = data.map(function(d) {
    return '<div class="kb-card">' +
      '<div class="kb-card-title">' + esc(d.word) + '</div>' +
      '<div class="idiom-pinyin">' + esc(d.pinyin || '') + '</div>' +
      '<div class="idiom-meaning">' + esc(d.explanation || '').substring(0, 100) + '</div>' +
      (d.example ? '<div class="idiom-example">例：' + esc(d.example.substring(0, 60)) + '</div>' : '') +
      '</div>';
  }).join('');
}

function kbRenderXiehouyu(search) {
  var data = (_XIEHOUYU_DATA || []).filter(function(d) {
    if (!search) return true;
    return (d.riddle + d.answer).toLowerCase().indexOf(search) !== -1;
  });
  document.getElementById('kbCount').textContent = '共 ' + data.length + ' 条';
  var grid = document.getElementById('kbGrid');
  grid.innerHTML = data.map(function(d) {
    return '<div class="kb-card">' +
      '<div class="xhy-riddle">❓ ' + esc(d.riddle) + '</div>' +
      '<div class="xhy-answer">💡 ' + esc(d.answer) + '</div>' +
      '</div>';
  }).join('');
}

function kbShowPoem(idx) {
  // Find poem from filtered view — rebuild filter
  var search = (document.getElementById('kbSearch').value || '').trim().toLowerCase();
  var grade = parseInt(document.getElementById('kbGradeFilter').value) || 0;
  var data = (_POETRY_DATA || []).filter(function(p) {
    if (search) { var hay = (p.title + p.author + p.paragraphs.join('')).toLowerCase(); if (hay.indexOf(search) === -1) return false; }
    if (grade > 0 && p.grades && p.grades.indexOf(grade) === -1) return false;
    return true;
  });
  var p = data[idx];
  if (!p) return;
  document.getElementById('poemTitle').textContent = p.title + (p.required ? ' ⭐（必背）' : '');
  document.getElementById('poemAuthor').textContent = '〔' + p.author + '〕';
  document.getElementById('poemType').innerHTML = '<span class="poem-badge">' + esc(p.type) + '</span>';
  document.getElementById('poemLines').innerHTML = p.paragraphs.map(function(line) {
    return '<div>' + esc(line) + '</div>';
  }).join('');
  document.getElementById('poemModal').classList.add('active');
}

function kbClosePoem() {
  document.getElementById('poemModal').classList.remove('active');
}

function kbCopyPoem() {
  var title = document.getElementById('poemTitle').textContent;
  var author = document.getElementById('poemAuthor').textContent;
  var lines = document.getElementById('poemLines').innerText;
  var text = title + '\n' + author + '\n\n' + lines;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('poemCopyBtn');
    btn.textContent = '✅ 已复制';
    setTimeout(function() { btn.textContent = '📋 复制'; }, 2000);
  });
}

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Init
kbRender();
</script>
</body>
</html>
